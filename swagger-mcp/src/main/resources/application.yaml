server:
  port: 8081

spring:
  application:
    name: swagger-mcp
  ai:
    mcp:
      server:
        name: swagger-mcp-server
        version: 1.0.0
        type: ASYNC
        protocol: STATELESS
        instructions: >-
          Looks up OpenAPI (Swagger) specs of the services registered in the Swagger Center.
          Use it whenever the user asks about an API of these services or needs code that calls one.
          Flow: listServices, then getApiList (narrow down with keyword), then getApiDetail,
          then getComponentSchema for each $ref.

swagger-center:
  base-url: http://localhost:8080
